name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv python install 3.12
      # The extract layer OCRs scanned/photo golden fixtures
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: uv sync --extra dev --extra telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build mcp_run_history_server -warnaserror
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run sentinel evals run --fake --no-save --out runs/ci
  # Builds the image and runs both demos and the API in it; keyless, so it costs nothing
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/container_smoke_test.sh
        env:
          CONTAINER: docker
