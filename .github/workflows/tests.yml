name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    # Local Azure Table Storage for the hosted demo's store tests (dev account, no real Azure)
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
        ports: ["10002:10002"]
    env:
      AZURITE_TABLES_URL: http://127.0.0.1:10002/devstoreaccount1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv python install 3.12
      # The extract layer OCRs scanned/photo golden fixtures
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: uv sync --extra dev --extra telemetry
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build mcp_run_history_server -warnaserror
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run sentinel evals run --fake --no-save --out runs/ci
  # Builds the image and runs both demos and the API in it; keyless, so it costs nothing.
  # Both runtimes: rootless Podman on Linux maps users differently from Docker
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/container_smoke_test.sh
        env:
          CONTAINER: ${{ matrix.runtime }}
  # Every Azure template must compile with no warnings; nothing is deployed here
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: |
          for f in infra/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null 2> bicep.log || { cat bicep.log; exit 1; }
            cat bicep.log
            ! grep -qi warning bicep.log
          done
