name: evals
on:
  pull_request:
    paths:
      - "src/receipt_sentinel/prompts/**"
      - "src/receipt_sentinel/categorize/**"
      - "config/active_prompt.yaml"
      - "config/thresholds.yaml"
      - "src/receipt_sentinel/evals/golden/**"
      - "src/receipt_sentinel/evals/baseline.json"
      # Extraction, validation and scoring decide what the model sees and how it is graded
      - "src/receipt_sentinel/extract/**"
      - "src/receipt_sentinel/validate/**"
      - "src/receipt_sentinel/evals/scoring.py"
      - "src/receipt_sentinel/evals/golden_fixture_text.py"
      - "pyproject.toml"
      - "uv.lock"
permissions:
  contents: read
  pull-requests: write
jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv python install 3.12
      # The extract layer OCRs scanned/photo golden fixtures
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - run: uv sync
      - name: Run golden evals
        id: evals
        # Fork PRs get no secrets, so the real run would fail on a missing API key.
        if: github.event.pull_request.head.repo.fork == false
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: uv run sentinel evals run --public --no-save --out runs/ci --report-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: runs/ci/report.html
          # --public skips the receipt-level report once the golden set has real receipts.
          if-no-files-found: ignore
      - name: Comment summary on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: runs/ci/summary.md
      # Exit 1 = CRITICAL or drifting; exit 3 = provider errors left no verdict.
      - name: Fail on CRITICAL or no verdict
        if: steps.evals.outcome == 'failure'
        run: exit 1
