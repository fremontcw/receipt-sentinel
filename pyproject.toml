[project]
name = "receipt-sentinel"
version = "0.1.0"
description = "LLM receipt extraction with a regression-detection CI harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
sentinel = "receipt_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "C901", "PLR0915"]
per-file-ignores = { "tests/**" = ["S101"] }
mccabe.max-complexity = 10
pylint.max-statements = 50

[tool.mypy]
strict = true
packages = ["receipt_sentinel"]
mypy_path = "src"
