[project]
name = "receipt-sentinel"
version = "0.1.0"
description = "LLM receipt extraction with a regression-detection CI harness"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.25",
    "pymupdf>=2.0",
    "pytesseract>=0.3.13",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "opentelemetry-sdk>=1.25",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
]
telemetry = [
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-sdk>=1.25",
]
api = [
    "fastapi>=0.143.3",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
sentinel = "receipt_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# PyMuPDF's SWIG bindings warn on import under Python 3.12+; not ours to fix
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "C901", "PLR0915"]
per-file-ignores = { "tests/**" = ["S101"] }
mccabe.max-complexity = 10
pylint.max-statements = 50

[tool.mypy]
strict = true
packages = ["receipt_sentinel"]
mypy_path = "src"

# PyMuPDF ships partial annotations: many methods are untyped. Allow calling them only in the
# modules that wrap it; everything else stays fully strict.
[[tool.mypy.overrides]]
module = ["receipt_sentinel.extract.document_extractor", "receipt_sentinel.evals.synthetic_fixture_renderer"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["pytesseract"]
ignore_missing_imports = true
